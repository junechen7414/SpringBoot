plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.springdoc.openapi-gradle-plugin" version "1.9.0"
}

group = 'com.ibm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

openApi {
	apiDocsUrl.set("http://localhost:8787/v3/api-docs")
	outputDir.set(file("$buildDir/docs"))
	outputFileName.set("swagger.json")
	// plugin 預設只等 30 秒；本機冷啟動實測 20~30 秒（Flyway + springdoc init），已踩過
	// ConditionTimeoutException。CI runner 更慢，而 generate-docs job 是 swagger.json 推到
	// 下游 repo 的唯一途徑，失敗就是靜默斷更 —— 拉大餘裕，不影響成功時的耗時。
	waitTimeInSeconds.set(120)
	// 使用專屬的 openapi profile 進行文件生成
    customBootRun {
        args = ["--spring.profiles.active=openapi"]
    }
}

// springdoc 的 forkedSpringBootRun 只從 bootRun 複製 args/classpath/jvmArgs/environment，
// 沒有帶上 toolchain launcher，預設改用 Gradle daemon 的 JVM 啟動 app。若 daemon JVM 比
// 上面 toolchain 宣告的版本舊（本機常見：daemon 跑 17、toolchain 編出 69.0 的 class），
// app 會在啟動時 UnsupportedClassVersionError，接著 generateOpenApiDocs 只看得到
// 「Unable to connect to /v3/api-docs」的 timeout。明確指定 launcher 以對齊 toolchain。
tasks.named('forkedSpringBootRun') {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

repositories {
	mavenCentral()
}

dependencies {
	// ---- Web / MVC ----
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Boot 4 模組化：RestClient autoconfig（RestClient.Builder bean）已拆到專屬 starter
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// RestClient 底層 HTTP client
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	// ---- 安全（Spring Security）----
	// inbound HTTP Basic 認證；filter chain 只攔 inbound HTTP，DB / OTLP 推送 / 容器網路不受影響
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// ---- OpenAPI / Swagger ----
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// ---- 持久層 / 資料庫 ----
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	// Flyway for database migration（Boot 4 改走 starter）
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-oracle'
	// H2：測試與 OpenAPI 文件生成使用
	runtimeOnly 'com.h2database:h2'

	// ---- AOP ----
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	// ---- 韌性（Resilience4j：rate limiting、bulkhead，Boot 4 artifact）----
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

	// ---- 可觀測性（Observability）----
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 關鍵：將 Micrometer 指標透過 OTLP 格式導出
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	// 讓 Micrometer 支持 OTLP
	implementation 'io.micrometer:micrometer-registry-otlp'
	// 缺這個 OTLP 指標就完全不會匯出（而且不會有任何錯誤訊息）。
	// Boot 4 把 actuator 拆成多個模組後，OtlpMetricsExportAutoConfiguration 的
	// @ConditionalOnClass 同時要求 OtlpMeterRegistry（來自 micrometer-registry-otlp）
	// 與 org.springframework.boot.opentelemetry.autoconfigure.OpenTelemetryProperties
	// （來自本模組）。少了後者條件不成立 → 沒有 OtlpMeterRegistry bean → 沒有 publisher
	// 執行緒 → 靜默不推送。診斷方式見 docs/monitoring-usage-guide.md 的排錯章節。
	implementation 'org.springframework.boot:spring-boot-opentelemetry'
	implementation 'io.micrometer:micrometer-java21'

	// ---- 開發工具 ----
	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	developmentOnly "org.springframework.boot:spring-boot-devtools"

	// ---- 測試 ----
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// 供未來 @WithMockUser 等 web 層安全測試
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation "org.testcontainers:testcontainers-oracle-free:2.0.5"
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
}

tasks.named('test') {
	useJUnitPlatform{
        def excludeTag = System.getProperty('junit.platform.exclude.tags')
        if (excludeTag) {
            excludeTags excludeTag.split(',')
        }
	}
	// 明確禁用並行測試執行，避免 Oracle 容器競爭
	maxParallelForks = 1
}
