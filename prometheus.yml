global:
  scrape_interval: 10s

# 這裡刻意不設 scrape_configs：Prometheus 自己不去抓 app，而是 Alloy 去 scrape app 之後 remote_write
# 進來（見 config.alloy 的 prometheus.scrape "app"）。`up{job="demo-app"}` 因此是 Alloy 產生並寫入的。
# 原因是 app 的 /actuator/prometheus 需要 Basic 認證，帳密集中放在 Alloy 一處。
#
# 「接收 remote_write」是靠 docker-compose.yml 裡的 --web.enable-remote-write-receiver
# 這個 CLI flag 開啟的，不是靠設定檔。設定檔的 remote_write: 語意相反 —— 那是叫
# Prometheus 把自己的資料推「出去」給別的後端，填自己的位址等於推給自己。
scrape_configs: []
