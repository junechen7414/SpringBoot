# Grafana dashboard provider 佈建
#
# 告訴 Grafana：去 /etc/grafana/dashboards 掃 JSON 檔並載入成 dashboard。
# 那個目錄由 docker-compose.yml 以唯讀方式掛載自 repo 的 ./grafana/dashboards。
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    # 在 UI 刪掉 dashboard 時，不要連 JSON 檔一起刪（檔案是 repo 內容，唯讀掛載）
    disableDeletion: false
    # 改了 JSON 存檔後，最多 15 秒就會載入，重新整理瀏覽器即可，不必重啟容器。
    # 一定要 > 10：≤ 10 時 Grafana 改用 fsnotify 監看檔案事件而不輪詢，
    # 但 Windows → podman machine 的 bind mount 不會轉發這些事件，結果是永遠不重載。
    # > 10 才會改成定時輪詢，見 docs/monitoring-usage-guide.md §7.4。
    updateIntervalSeconds: 15
    # 允許在 UI 上直接改（存下來只進 Grafana 自己的 DB，不會寫回 JSON 檔；
    # 想讓改動進 git 要用 Dashboard settings → JSON Model 複製出來貼回檔案）
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      # 讓子目錄名成為 Grafana 的 folder 名稱
      foldersFromFilesStructure: false
