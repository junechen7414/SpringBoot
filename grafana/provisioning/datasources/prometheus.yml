# Grafana datasource 佈建
#
# Grafana 啟動時會讀 /etc/grafana/provisioning/datasources/ 底下的檔案自動建立
# datasource，不必手動在 UI 點。手動建的東西存在 grafana-data volume 裡，volume
# 一砍就沒了；佈建檔進 git 才是可重現的做法。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid 固定寫死：dashboard JSON 用這個 uid 引用 datasource，
    # 若讓 Grafana 隨機產生 uid，佈建的 dashboard 會找不到資料來源。
    uid: prometheus
    access: proxy
    # grafana 與 prometheus 同在 monitor-net，用 compose 的 service 名互連。
    # 不是 localhost:9090 —— 那是「grafana 容器自己」的 9090。
    url: http://prometheus:9090
    isDefault: true
    # 佈建的 datasource 在 UI 上唯讀；要改請改這個檔案再重啟 grafana 容器。
    editable: false
    jsonData:
      # 與 config.alloy 的 prometheus.scrape "app" 的 scrape_interval 對齊，
      # Grafana 才知道資料點的最小間隔，$__rate_interval 也才算得準。
      timeInterval: 10s
      # 讓指標圖上的 exemplar 小菱形可以直接點進 Tempo 的那條 trace。
      # 這條鏈要五個環節同時成立，缺一個都是「沒有小菱形」而不會報錯
      # （完整的表見 docs/agents/09-monitoring.md）：
      #   1. 應用要產生 exemplar，且 Prometheus registry 只在 OpenMetrics 格式的回應裡才帶
      #   2. Alloy 抓取時要協商 OpenMetrics —— config.alloy 的 scrape_protocols
      #   3. Alloy 送出時要帶 exemplar —— config.alloy 的 send_exemplars = true
      #   4. Prometheus 要存 exemplar —— docker-compose.yml 的
      #      --enable-feature=exemplar-storage
      #   5. 這裡要告訴 Grafana「trace id 在哪個 label、要跳去哪個 datasource」
      # name 是 exemplar 上的 label 名，由 Micrometer 寫在 exemplar 裡，
      # 固定叫 trace_id（不是 traceID／traceId）。
      exemplarTraceIdDestinations:
        - name: trace_id
          # 對應 tempo.yml 裡寫死的 uid。
          datasourceUid: tempo
