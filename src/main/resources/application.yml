# ============================================================================
# Spring Profile Configuration Strategy
# ============================================================================
# This application uses Spring profiles to manage environment-specific settings.
#
# Available Profiles:
# -------------------
# 1. 'dev' (Development) - Default profile for local development
#    - Uses Oracle database with credentials from environment variables
#    - Enables DEBUG logging for application code
#    - Configures metrics export to Alloy/Prometheus
#    - Schema is owned by Flyway; Hibernate only validates it (ddl-auto: validate)
#    - See: application-dev.yml
#
# 2. 'integration-test' (Integration Testing)
#    - Activated by BaseIntegrationTest's @ActiveProfiles; Testcontainers supplies
#      the datasource via @ServiceConnection, so no DB settings are needed here
#    - See: src/test/resources/application-integration-test.yml (test-only, and it
#      may stay there precisely because it is never needed inside the fat jar)
#    - NOTE: unit tests do NOT have a profile of their own — they are plain Mockito
#      tests that never start a Spring context, so there is nothing to configure
#
# 3. 'openapi' (OpenAPI Documentation Generation)
#    - Lightweight profile for generating API documentation during build
#    - Uses H2 in-memory database to avoid external dependencies
#    - Disables unnecessary features for faster startup
#    - See: application-openapi.yml
#
# 4. 'e2e' (End-to-End Testing)
#    - Used by the downstream Playwright repository, which runs the published GHCR
#      image with SPRING_PROFILES_ACTIVE=e2e
#    - See: application-e2e.yml (main resources — it must be inside the fat jar to
#      take effect; a copy under src/test/resources would NOT be packaged by bootJar)
#    - Deployment-side settings (DB host/credentials, monitoring endpoint) are NOT
#      in that file: they come from the downstream docker-compose environment
#
# Overriding the Default Profile:
# --------------------------------
# The default profile is set to 'dev' for convenience during development.
# To use a different profile in production or other environments:
#
# Option 1: Environment Variable (Recommended for production)
#   export SPRING_PROFILES_ACTIVE=prod
#   or set SPRING_PROFILES_ACTIVE=prod (Windows)
#
# Option 2: Command Line Argument
#   java -jar app.jar --spring.profiles.active=prod
#
# Option 3: System Property
#   java -Dspring.profiles.active=prod -jar app.jar
#
# Migration Notes:
# ----------------
# - Datasource configuration has been moved from application.yml to profile-specific files
# - Existing deployments should set SPRING_PROFILES_ACTIVE environment variable
# - Production environments should NOT use 'dev' profile (configured for local development)
# ============================================================================

spring:
  profiles:
    active: dev
  application:
    name: demo
  threads:
    virtual:
      enabled: true
  jpa:
    # 明確關閉 OSIV：DB 存取只發生在交易/service 邊界內，避免 view 階段的延遲查詢(N+1)與 lazy 關聯洩漏。
    # order 讀取/更新/刪除端點均已改為在交易內把資料萃取為 DTO（OrderTransactionalService
    # 的 loadOrderView(s)/prepareOrderDeletion），不再於交易外碰 lazy orderDetails。
    open-in-view: false
  main:
    banner-mode: off
server:
  port: 8787

springdoc:
  swagger-ui:
    # Authorize 輸入的憑證存進瀏覽器 localStorage：重新整理或重開分頁後仍在，不必每次重打。
    # 只影響 Swagger UI 這個前端頁面，伺服器端不保存任何憑證（filter chain 仍是 STATELESS + 每次驗 Basic）。
    persist-authorization: true

logging:
  level:
    "[com.ibm.demo]": INFO

management:
  endpoints:
    web:
      exposure:
        # 不含 prometheus：classpath 只有 micrometer-registry-otlp，沒有 prometheus
        # registry，/actuator/prometheus 不會 materialize（列了也只是誤導）。
        include: health,info,metrics
  otlp:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      show-details: always

app:
  base-url: http://localhost:${server.port}
  # HTTP Basic 認證帳密（env 覆寫）。預設值僅供本地 bootRun 開箱即用；正式環境務必以 env 覆蓋。
  auth:
    api-username: ${API_USERNAME:api}
    api-password: ${API_PASSWORD:local-api-secret}
    internal-username: ${INTERNAL_USERNAME:internal}
    internal-password: ${INTERNAL_PASSWORD:local-internal-secret}

http:
  client:
    max-total: 200
    default-max-per-route: 150
    connection-request-timeout: 4s
    response-timeout: 5s
    evict-idle-connections-period: 30s

# Resilience4j 配置 - 替換原有的自定義 Semaphore 限流機制
# 使用 Semaphore-based Bulkhead 實現 fail-fast 行為
resilience4j:
  bulkhead:
    configs:
      default:
        max-wait-duration: 0ms    # fail-fast: 不等待，立即拒絕
    instances:
      # 並發上限對齊 DB pool(10)：讀熱路徑給 ~2×pool 容許短暫排隊，寫收緊避免搶樂觀鎖。
      # 這些是「合理起點」，非終值 — 依 docs/resilience4j-load-testing-notes.md 壓測後收斂。
      # AccountService 方法級別配置
      account-read:
        max-concurrent-calls: 20
        max-wait-duration: 0ms
      account-write:
        max-concurrent-calls: 15
        max-wait-duration: 0ms
      account-write-with-validation:
        max-concurrent-calls: 10
        max-wait-duration: 0ms

      # ProductService 方法級別配置
      product-read:
        max-concurrent-calls: 20   # 下單巢狀熱路徑；原本誤設為 5
        max-wait-duration: 0ms
      product-write:
        max-concurrent-calls: 15
        max-wait-duration: 0ms
      product-inventory:
        max-concurrent-calls: 10   # 高競爭寫入（樂觀鎖），收緊
        max-wait-duration: 0ms

      # OrderService 方法級別配置
      order-read:
        max-concurrent-calls: 20
        max-wait-duration: 0ms
      order-write:
        max-concurrent-calls: 10
        max-wait-duration: 0ms
  
  ratelimiter:
    configs:
      default:
        limit-refresh-period: 1s   # 每秒刷新限制
        timeout-duration: 0ms      # fail-fast: 不等待，立即拒絕
    instances:
      # 速率(每秒放行數)與並發脫鉤：讀 200/s、寫 100/s。dev 放寬以免壓測誤擋；
      # 正式環境依「單機可扛 QPS」壓測後調整。
      # AccountService 方法級別配置
      account-read:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0ms
      account-write:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0ms
      account-write-with-validation:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0ms

      # ProductService 方法級別配置
      product-read:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0ms
      product-write:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0ms
      product-inventory:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0ms

      # OrderService 方法級別配置
      order-read:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0ms
      order-write:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0ms
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100            # 擴大窗口，增加統計置信度
        minimum-number-of-calls: 50         # 至少 50 個請求才開始計算
        failure-rate-threshold: 50          # 50% 失敗率觸發開路
        wait-duration-in-open-state: 60s    # 給予下游 60 秒恢復時間
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        # 只對「下游真的壞了」反應：正常業務拒絕（餘額不足、查無資源…）不算失敗，
        # 否則一波驗證失敗會誤把斷路器打開、擋掉合法請求。
        ignore-exceptions:
          - com.ibm.demo.exception.BusinessException
    instances:
      OrderService:
        base-config: default
        # sliding-window-size: 10
        # minimum-number-of-calls: 5
        # failure-rate-threshold: 50
        # wait-duration-in-open-state: 30s
        # permitted-number-of-calls-in-half-open-state: 3
      AccountService:
        base-config: default
      ProductService:
        base-config: default
