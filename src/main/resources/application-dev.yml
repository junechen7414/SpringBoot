spring:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_DB_HOST:localhost}:1521/FREEPDB1
    username: ${ORACLE_DEV_USERNAME}
    password: ${ORACLE_DEV_PASSWORD}
    hikari:
      maximum-pool-size: 10      # dev 本機連線池（固定大小）；依 (核心數×2)+spindle 公式，對齊 DB 核心數
      connection-timeout: 5000    # 5 秒連接超時
      max-lifetime: 1800000       # 30 分鐘最大生命週期
  jpa:
    hibernate:
      ddl-auto: validate  
    properties:
      hibernate:
        "[format_sql]": true        
        jdbc:
          lob:
            "[non_contextual_creation]": true
  flyway:
    enabled: true  # 使用 Flyway 進行資料庫遷移版本控制

logging:
  level:
    "[com.ibm.demo]": DEBUG
    "[org.hibernate.SQL]": DEBUG  # 開發環境顯示 SQL 語句，方便除錯
    "[org.hibernate.orm.jdbc.bind]": TRACE

management:
  otlp:
    metrics:
      export:
        # 只有主機名因執行環境而異（容器內是 alloy、本機 IDE/bootRun 是 localhost），
        # 與第 3 行的 ORACLE_DB_HOST 同一個慣例。
        url: http://${ALLOY_HOST:localhost}:4318/v1/metrics
        # 本機沒起監控堆疊時可設 false，避免每個 step 噴一次連線失敗
        enabled: ${OTLP_METRICS_ENABLED:true}
        step: 10s
        # Prometheus 生態一律以秒為單位。預設的 milliseconds 會讓指標名帶
        # _milliseconds 後綴且值為毫秒，與所有 PromQL 範例、Grafana 單位都不合。
        # 注意不要動 aggregation-temporality（預設 cumulative）—— rate() 依賴單調
        # 遞增的累積計數，改成 delta 會讓所有 rate() 查詢失效。
        base-time-unit: seconds
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 不開這個，OTLP 只會送出 count/sum 而沒有 bucket，histogram_quantile() 查不到
      # p99。代價是時間序列數量變多（每個 uri × 每個 bucket），單機 demo 吃得下。
      percentiles-histogram:
        "[http.server.requests]": true
