spring:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_DB_HOST:localhost}:1521/FREEPDB1
    username: ${ORACLE_DEV_USERNAME}
    password: ${ORACLE_DEV_PASSWORD}
    hikari:
      maximum-pool-size: 10      # dev 本機連線池（固定大小）；依 (核心數×2)+spindle 公式，對齊 DB 核心數
      connection-timeout: 5000    # 5 秒連接超時
      max-lifetime: 1800000       # 30 分鐘最大生命週期
  jpa:
    hibernate:
      ddl-auto: validate  
    properties:
      hibernate:
        "[format_sql]": true        
        jdbc:
          lob:
            "[non_contextual_creation]": true
  flyway:
    enabled: true  # 使用 Flyway 進行資料庫遷移版本控制

logging:
  level:
    "[com.ibm.demo]": DEBUG
    "[org.hibernate.SQL]": DEBUG  # 開發環境顯示 SQL 語句，方便除錯
    "[org.hibernate.orm.jdbc.bind]": TRACE

management:
  # 指標不再由 app 推送：Alloy 來 scrape /actuator/prometheus。OTLP 指標匯出維持 base
  # application.yml 的 enabled: false，這裡不要打開 —— 兩條線同時進 Prometheus 會讓同一個指標
  # 出現兩組 series（scrape 那組帶 job/instance，OTLP 那組沒有），sum by (uri) 靜默地算成兩倍。
  # base-time-unit 也不必設：Prometheus registry 本身固定用秒。
  tracing:
    sampling:
      # 全採樣。預設是 0.1，在單機 demo 上會變成「打了 API 卻查不到 trace」的常態，
      # 很容易被誤判成鏈路沒接通。正式環境請往下調 —— trace 量與儲存成本成正比。
      probability: 1.0
    export:
      otlp:
        # 本機沒起監控堆疊時設成 false，免得 batch span processor 每 5 秒噴一次連線失敗。
        # 這個開關由 @ConditionalOnEnabledTracingExport 消化。指標已改走 scrape，不受它影響：
        # 關掉追蹤不影響指標，反之亦然。
        enabled: ${OTLP_TRACING_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Alloy 的 OTLP 4318 埠（path 是 /v1/traces）。指標已改走 scrape，現在只有追蹤用這個埠。
          #
          # 容易踩的事：Boot 3.x 的 management.otlp.tracing.endpoint 在 Boot 4 是
          # deprecation level=error，寫舊名不是「靜默失效」而是直接啟動失敗。
          #
          # 沒設這個值時 exporter bean 根本不會建立（@ConditionalOnProperty），
          # 所以其他 profile 不需要另外關 tracing —— 不給 endpoint 就等於沒開。
          endpoint: http://${ALLOY_HOST:localhost}:4318/v1/traces
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 不開這個，/actuator/prometheus 只有 count/sum 而沒有 _bucket，histogram_quantile() 查不到
      # p99。代價是時間序列數量變多（每個 uri × 每個 bucket），單機 demo 吃得下。
      percentiles-histogram:
        "[http.server.requests]": true
