spring:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_DB_HOST:localhost}:1521/FREEPDB1
    username: ${ORACLE_DEV_USERNAME}
    password: ${ORACLE_DEV_PASSWORD}
    hikari:
      maximum-pool-size: 10      # dev 本機連線池（固定大小）；依 (核心數×2)+spindle 公式，對齊 DB 核心數
      connection-timeout: 5000    # 5 秒連接超時
      max-lifetime: 1800000       # 30 分鐘最大生命週期
  jpa:
    hibernate:
      ddl-auto: validate  
    properties:
      hibernate:
        "[format_sql]": true        
        jdbc:
          lob:
            "[non_contextual_creation]": true
  flyway:
    enabled: true  # 使用 Flyway 進行資料庫遷移版本控制

logging:
  level:
    "[com.ibm.demo]": DEBUG
    "[org.hibernate.SQL]": DEBUG  # 開發環境顯示 SQL 語句，方便除錯
    "[org.hibernate.orm.jdbc.bind]": TRACE

management:
  otlp:
    metrics:
      export:
        # 只有主機名因執行環境而異（容器內是 alloy、本機 IDE/bootRun 是 localhost），
        # 與第 3 行的 ORACLE_DB_HOST 同一個慣例。
        url: http://${ALLOY_HOST:localhost}:4318/v1/metrics
        # 本機沒起監控堆疊時可設 false，避免每個 step 噴一次連線失敗
        enabled: ${OTLP_METRICS_ENABLED:true}
        step: 10s
        # Prometheus 生態一律以秒為單位。預設的 milliseconds 會讓指標名帶
        # _milliseconds 後綴且值為毫秒，與所有 PromQL 範例、Grafana 單位都不合。
        # 注意不要動 aggregation-temporality（預設 cumulative）—— rate() 依賴單調
        # 遞增的累積計數，改成 delta 會讓所有 rate() 查詢失效。
        base-time-unit: seconds
  tracing:
    sampling:
      # 全採樣。預設是 0.1，在單機 demo 上會變成「打了 API 卻查不到 trace」的常態，
      # 很容易被誤判成鏈路沒接通。正式環境請往下調 —— trace 量與儲存成本成正比。
      probability: 1.0
    export:
      otlp:
        # 本機沒起監控堆疊時設成 false，免得 batch span processor 每 5 秒噴一次連線失敗。
        # 與上面的 OTLP_METRICS_ENABLED 用途相同但彼此獨立：指標與 trace 是兩條鏈，
        # 關掉一條不影響另一條。這個開關由 @ConditionalOnEnabledTracingExport 消化。
        enabled: ${OTLP_TRACING_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          # 與指標同一個 Alloy、同一個 4318 埠，只有 path 不同（/v1/traces）。
          #
          # 兩件容易踩的事：
          # 1. 屬性名不對稱 —— 指標是 management.otlp.metrics.export.url，
          #    trace 是 management.opentelemetry.tracing.export.otlp.endpoint。
          # 2. Boot 3.x 的 management.otlp.tracing.endpoint 在 Boot 4 是
          #    deprecation level=error，寫舊名不是「靜默失效」而是直接啟動失敗。
          #
          # 沒設這個值時 exporter bean 根本不會建立（@ConditionalOnProperty），
          # 所以其他 profile 不需要另外關 tracing —— 不給 endpoint 就等於沒開。
          endpoint: http://${ALLOY_HOST:localhost}:4318/v1/traces
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 不開這個，OTLP 只會送出 count/sum 而沒有 bucket，histogram_quantile() 查不到
      # p99。代價是時間序列數量變多（每個 uri × 每個 bucket），單機 demo 吃得下。
      percentiles-histogram:
        "[http.server.requests]": true
